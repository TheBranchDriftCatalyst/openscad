apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: manyfold
  labels:
    app.kubernetes.io/name: manyfold
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: Manyfold
    gethomepage.dev/description: 3D model library
    gethomepage.dev/group: Apps
    gethomepage.dev/icon: manyfold.png
    gethomepage.dev/href: https://manyfold.talos00
    gethomepage.dev/siteMonitor: http://manyfold.openscad.svc.cluster.local:3214/health
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`manyfold.talos00`)
      middlewares:
        - name: authentik
          namespace: authentik
      services:
        - name: manyfold
          port: 3214
  tls: {}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: manyfold-http
  labels:
    app.kubernetes.io/name: manyfold
spec:
  entryPoints:
    - web
  routes:
    - kind: Rule
      match: Host(`manyfold.talos00`)
      middlewares:
        - name: redirect-https
          namespace: traefik
      services:
        - name: manyfold
          port: 3214
