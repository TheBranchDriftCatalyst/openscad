apiVersion: dragonflydb.io/v1alpha1
kind: Dragonfly
metadata:
  name: manyfold-cache
  labels:
    app.kubernetes.io/name: manyfold-cache
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: openscad
spec:
  replicas: 1
  image: docker.dragonflydb.io/dragonflydb/dragonfly:v1.39.0
  args:
    - --proactor_threads=1
    - --maxmemory=256mb
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
