apiVersion: v1
kind: Secret
metadata:
  name: manyfold-postgres-app
  labels:
    app.kubernetes.io/name: manyfold-postgres
type: Opaque
stringData:
  username: manyfold
  password: manyfold-local
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: manyfold-postgres
  labels:
    app.kubernetes.io/name: manyfold-postgres
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: manyfold-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: manyfold-postgres
    spec:
      automountServiceAccountToken: false
      containers:
        - name: postgres
          image: postgres:18.4-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: manyfold
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: manyfold-postgres-app
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: manyfold-postgres-app
                  key: password
          volumeMounts:
            - name: data
              # PostgreSQL 18+ stores PGDATA below /var/lib/postgresql/18/docker.
              mountPath: /var/lib/postgresql
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "manyfold", "-d", "manyfold"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "manyfold", "-d", "manyfold"]
            initialDelaySeconds: 20
            periodSeconds: 10
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: manyfold-postgres-rw
  labels:
    app.kubernetes.io/name: manyfold-postgres
spec:
  selector:
    app.kubernetes.io/name: manyfold-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
