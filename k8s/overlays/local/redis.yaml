apiVersion: apps/v1
kind: Deployment
metadata:
  name: manyfold-cache
  labels:
    app.kubernetes.io/name: manyfold-cache
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: manyfold-cache
  template:
    metadata:
      labels:
        app.kubernetes.io/name: manyfold-cache
    spec:
      automountServiceAccountToken: false
      containers:
        - name: redis
          image: redis:8.8.0-alpine
          ports:
            - name: redis
              containerPort: 6379
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: manyfold-cache
  labels:
    app.kubernetes.io/name: manyfold-cache
spec:
  selector:
    app.kubernetes.io/name: manyfold-cache
  ports:
    - name: redis
      port: 6379
      targetPort: redis
