apiVersion: apps/v1
kind: Deployment
metadata:
  name: manyfold
  labels:
    app.kubernetes.io/name: manyfold
    app.kubernetes.io/part-of: openscad
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: manyfold
  template:
    metadata:
      labels:
        app.kubernetes.io/name: manyfold
        app.kubernetes.io/part-of: openscad
    spec:
      serviceAccountName: manyfold
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manyfold
          image: ghcr.io/manyfold3d/manyfold:0.146.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3214
              protocol: TCP
          envFrom:
            - configMapRef:
                name: manyfold-config
            - secretRef:
                name: manyfold-secrets
          env:
            - name: DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: manyfold-postgres-app
                  key: username
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: manyfold-postgres-app
                  key: password
          volumeMounts:
            - name: library
              mountPath: /library
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "2"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - DAC_OVERRIDE
                - SETUID
                - SETGID
      volumes:
        - name: library
          persistentVolumeClaim:
            claimName: manyfold-library
